<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>プロフィールページ</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (isLoading) {
  <!-- Loading skeleton -->
  <div class="ion-padding" role="status">
    <p>プロフィールを読み込み中...</p>

    @for (field of [1, 2, 3]; track field) {
    <ion-item>
      <ion-label>
        <ion-skeleton-text [animated]="true" style="width: 30%; height: 14px" />
        <ion-skeleton-text [animated]="true" style="width: 75%; height: 24px" />
      </ion-label>
    </ion-item>
    }
  </div>
  } @else if (loadError) {
  <div class="ion-padding ion-text-center" role="alert">
    <p>Unable to load your profile.</p>

    <ion-button (click)="loadProfile()"> Retry </ion-button>
  </div>
  } @else {
  <!-- Loaded profile -->
  <ion-item>
    <ion-input
      label="Name"
      labelPlacement="fixed"
      class="profile-input"
      [(ngModel)]="profile.name"
    />
  </ion-item>

  <ion-item>
    <ion-input
      label="Email"
      labelPlacement="fixed"
      class="profile-input"
      type="email"
      [(ngModel)]="profile.email"
    />
  </ion-item>

  <ion-item>
    <ion-input
      label="Date of Birth"
      labelPlacement="fixed"
      class="profile-input"
      [(ngModel)]="profile.DOB"
    />
  </ion-item>

  <ion-item [routerLink]="['/reset-password']"> Reset Password </ion-item>
  }
</ion-content>

<ion-footer>
  <ion-row no-padding text-center>
    <ion-col size="12" size-xl="5" offset-xl="3.5" size-md="8" offset-md="2">
      <ion-button
        expand="block"
        (click)="updateProfile()"
        [disabled]="isLoading || loadError || isSaving || !profileId"
      >
        保存
      </ion-button>
    </ion-col>
  </ion-row>
</ion-footer>
