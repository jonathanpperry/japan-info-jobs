<ion-app>
  <!-- Side navigation drawer -->
  <ion-menu
    menuId="main-menu"
    side="start"
    contentId="main-content"
    [disabled]="!showMenu"
  >
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Japan Info Jobs</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-menu-toggle>
          <ion-item
            routerLink="/tabs/home"
            routerDirection="root"
            detail="false"
          >
            <ion-label>ホーム (Home)</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item routerLink="/profile" routerDirection="root" detail="false">
            <ion-label>プロフィール (Profile)</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item
            routerLink="/settings"
            routerDirection="root"
            detail="false"
          >
            <ion-label>設定 (Settings)</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item
            button
            lines="none"
            [disabled]="isLoggingOut"
            (click)="logout()"
          >
            <ion-label>ログアウト (Log Out)</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Main application content -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
